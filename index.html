<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Itinerary" />
  <title>Swipe Itinerary</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>

  <!-- Activity ("row") editor -->
  <dialog id="itemDialog" class="sheet">
    <form id="itemForm" method="dialog">
      <div class="sheet-handle"></div>
      <h2 id="itemDialogTitle">New activity</h2>

      <div class="field-row">
        <label class="field">
          <span>Time</span>
          <input type="time" name="time" />
        </label>
        <label class="field">
          <span>Until (optional)</span>
          <input type="time" name="endTime" />
        </label>
      </div>

      <label class="field">
        <span>Activity *</span>
        <input type="text" name="activity" required placeholder="e.g. Visit Fushimi Inari" autocomplete="off" />
      </label>

      <div class="field">
        <span>Transportation</span>
        <div id="legRows" class="leg-rows"></div>
        <button type="button" class="btn small dashed" id="addLeg">+ Add transfer (another bus / train…)</button>
      </div>

      <div class="field">
        <span>Fees</span>
        <div id="feeRows" class="fee-rows"></div>
        <button type="button" class="btn small dashed" id="addFee">+ Add another fee</button>
        <div class="convert-hint" id="feeTotal"></div>
      </div>

      <label class="field">
        <span>Remarks</span>
        <textarea name="remarks" rows="3" placeholder="Booking no., tips, what to bring…"></textarea>
      </label>

      <div class="sheet-actions">
        <button type="button" class="btn ghost danger" id="itemDelete">Delete</button>
        <button type="button" class="btn ghost" id="itemDuplicate">Duplicate</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="itemCancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Trip editor -->
  <dialog id="tripDialog" class="sheet">
    <form id="tripForm" method="dialog">
      <div class="sheet-handle"></div>
      <h2 id="tripDialogTitle">New trip</h2>
      <label class="field">
        <span>Trip name *</span>
        <input type="text" name="name" required placeholder="e.g. Japan 2026" autocomplete="off" />
      </label>
      <div class="field-row">
        <label class="field">
          <span>Start date</span>
          <input type="date" name="startDate" />
        </label>
        <label class="field">
          <span>Days</span>
          <input type="number" name="dayCount" min="1" max="60" value="1" inputmode="numeric" />
        </label>
      </div>
      <div class="field-row">
        <label class="field">
          <span>Main currency</span>
          <select name="currency"></select>
        </label>
        <label class="field">
          <span>Convert totals to</span>
          <select name="base"></select>
        </label>
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn ghost danger" id="tripDelete">Delete trip</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="tripCancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Day editor -->
  <dialog id="dayDialog" class="sheet">
    <form id="dayForm" method="dialog">
      <div class="sheet-handle"></div>
      <h2 id="dayDialogTitle">Day</h2>
      <label class="field">
        <span>Title (optional)</span>
        <input type="text" name="title" placeholder="e.g. Kyoto temples" autocomplete="off" />
      </label>
      <div class="sheet-actions">
        <button type="button" class="btn ghost danger" id="dayDelete">Delete day</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="dayCancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Spending editor -->
  <dialog id="spendDialog" class="sheet">
    <form id="spendForm" method="dialog">
      <div class="sheet-handle"></div>
      <h2 id="spendDialogTitle">New spending</h2>
      <label class="field">
        <span id="spendWhatLabel">Item *</span>
        <input type="text" name="what" required placeholder="e.g. Matcha ice cream, souvenirs" autocomplete="off" />
      </label>
      <div class="field" id="catField">
        <span>Category</span>
        <div class="chips" id="catChips"></div>
      </div>
      <div class="field">
        <span id="spendPriceLabel">Price</span>
        <div class="money">
          <select name="currency" aria-label="Currency"></select>
          <input type="number" name="amount" inputmode="decimal" step="any" min="0" placeholder="0.00" aria-label="Price" />
        </div>
      </div>
      <div class="field" id="spendRateField">
        <span>Exchange rate</span>
        <div class="rate-line">1 <b id="spendRateFrom"></b> =
          <input type="number" name="rate" inputmode="decimal" step="any" min="0" placeholder="rate" aria-label="Exchange rate" />
          <b id="spendRateTo"></b></div>
      </div>
      <div class="converted" id="spendConverted"></div>
      <div class="field" id="payerField">
        <span>Who paid</span>
        <div class="chips" id="payerChips"></div>
        <input type="text" name="paidBy" placeholder="Name" autocomplete="off" />
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn ghost danger" id="spendDelete">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="spendCancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Currencies & exchange rates -->
  <dialog id="ratesDialog" class="sheet">
    <form id="ratesForm" method="dialog">
      <div class="sheet-handle"></div>
      <h2>Currencies &amp; rates</h2>
      <p class="muted-note" id="ratesNote"></p>
      <div id="ratesList" class="rates-list"></div>
      <div class="money">
        <select id="ratesAddSel" aria-label="Add currency"></select>
        <button type="button" class="btn small" id="ratesAdd">+ Add currency</button>
      </div>
      <button type="button" class="btn" id="ratesFetch">🔄 Get latest rates (needs internet)</button>
      <div class="sheet-actions">
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="ratesCancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden />

  <script src="app.js"></script>
</body>
</html>
